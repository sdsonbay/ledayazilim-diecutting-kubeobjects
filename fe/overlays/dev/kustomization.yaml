apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: leda-diecutting-dev

resources:
  - ../../base

generators:
  - ksops.yaml

configMapGenerator:
  - name: leda-diecutting-web-env
    literals:
      - API_PROXY_PASS=http://leda-diecutting-api:8080/api/
      - APP_ENV=dev

patches:
  - target: { kind: Ingress, name: leda-diecutting-web }
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev-diecutting.ledayazilim.com
      - op: replace
        path: /spec/rules/0/host
        value: dev-diecutting.ledayazilim.com

images:
  - name: leda-diecutting-web
    newName: ghcr.io/sdsonbay/ledayazilim-diecutting-fe
    newTag: "sha-74170c8"
