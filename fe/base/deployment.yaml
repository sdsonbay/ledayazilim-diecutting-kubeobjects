apiVersion: apps/v1
kind: Deployment
metadata:
  name: leda-diecutting-web
  labels:
    app: leda-diecutting-web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: leda-diecutting-web
  template:
    metadata:
      labels:
        app: leda-diecutting-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull-web
      containers:
        - name: web
          image: leda-diecutting-web
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: leda-diecutting-web-env
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 300m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
